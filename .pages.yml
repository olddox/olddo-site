# 歐豆攝影教室網站後台設定（Pages CMS）
media:
  input: images
  output: /images
  categories: [image]

content:
  - name: pages
    label: 自訂頁面
    type: collection
    path: p
    format: yaml-frontmatter
    filename:
      template: "{slug}.html"
      field: false
    view:
      primary: title
      fields: [title, slug]
    fields:
      - name: title
        label: 頁面名稱
        type: string
        required: true
        description: 給自己看的名稱，例如「手機攝影基礎班」
      - name: slug
        label: 網址名稱
        type: string
        required: true
        description: 只能用小寫英文、數字和「-」，例如 mobile-class。網頁網址會是 new.olddo.com/p/mobile-class.html（存檔後就不能改）
        pattern:
          regex: "^[a-z0-9-]+$"
          message: 只能用小寫英文、數字和「-」
      - name: body
        label: 原始碼
        type: code
        description: 把整段 HTML 原始碼貼在這裡
        options:
          format: html

  - name: home
    label: 首頁
    type: file
    path: index.html

  - name: lv1
    label: 攝影基礎班 LV1
    type: file
    path: lv1.html

  - name: tools
    label: 攝影工具區（目錄頁）
    type: file
    path: tools.html
