<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>歐色會 OCOLOR｜歐豆攝影教室</title>
<meta name="description" content="歐色會 OCOLOR：給底片愛好者的調色與簽名工具。歐豆攝影教室學員專屬，登入後使用。">
<style>
:root{--bg:#F4F2EE;--ink:#161616;--sub:#5A5752;--line:#D8D4CC;--red:#B3261E;--card:#FFFFFF;--gold:#C9934A}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',system-ui,-apple-system,sans-serif}
.oc-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.oc-card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);padding:36px 28px}
.oc-brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.oc-dot{width:40px;height:40px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center}
.oc-dot i{display:block;width:16px;height:16px;border-radius:50%;background:#161616}
.oc-brand b{font-size:26px;letter-spacing:.06em}
.oc-brand span{font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.2em;color:var(--gold)}
.oc-lead{margin:0 0 24px;font-size:14px;color:var(--sub);line-height:1.8}
.oc-tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:20px}
.oc-tab{flex:1;font:inherit;font-size:15px;padding:12px 0;background:none;border:0;border-bottom:2px solid transparent;color:var(--sub);cursor:pointer}
.oc-tab.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}
.oc-f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.oc-f label{font-size:13px;color:var(--sub)}
.oc-f input{font:inherit;font-size:16px;padding:12px 14px;min-height:46px;border:1px solid #8E8A83;background:#fff;color:var(--ink);border-radius:0}
.oc-f input:focus{outline:2px solid var(--ink);outline-offset:1px}
.oc-btn{width:100%;font:inherit;font-size:16px;font-weight:700;letter-spacing:.1em;min-height:50px;border:0;background:var(--red);color:#fff;cursor:pointer;margin-top:6px}
.oc-btn:disabled{background:#8E8A83;cursor:wait}
.oc-msg{min-height:24px;margin:14px 0 0;font-size:14px;line-height:1.7}
.oc-msg.err{color:var(--red)}
.oc-msg.ok{color:#2E6B3A}
.oc-note{margin:22px 0 0;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--sub);line-height:1.8}
.oc-note a{color:var(--red)}
.oc-hide{display:none!important}
.oc-loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);font-size:15px;color:var(--sub)}
.oc-spin{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:oc-r 1s linear infinite}
@keyframes oc-r{to{transform:rotate(360deg)}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--ink:#EDEBE6;--sub:#A9A59E;--line:#3A3A3A;--card:#1C1C1C}:root:not([data-theme="light"]) .oc-f input{background:#111;color:#EDEBE6;border-color:#555}}
</style>
</head>
<body>
<div class="oc-wrap" id="oc-gate">
  <div class="oc-card">
    <div class="oc-brand"><div class="oc-dot"><i></i></div><b>歐色會</b><span>OCOLOR</span></div>
    <p class="oc-lead">給底片愛好者的調色與簽名工具。<br>歐豆攝影教室學員專屬，核准後可使用一年。</p>
    <div class="oc-tabs" role="tablist">
      <button class="oc-tab on" id="oc-t-login" type="button" role="tab">登入</button>
      <button class="oc-tab" id="oc-t-reg" type="button" role="tab">申請帳號</button>
    </div>

    <form id="oc-login" autocomplete="on">
      <div class="oc-f"><label for="oc-le">Email</label><input id="oc-le" type="email" autocomplete="username" required></div>
      <div class="oc-f"><label for="oc-lp">密碼</label><input id="oc-lp" type="password" autocomplete="current-password" required></div>
      <button class="oc-btn" type="submit">登入</button>
    </form>

    <form id="oc-reg" class="oc-hide" autocomplete="on">
      <div class="oc-f"><label for="oc-rn">姓名（請填真實姓名，方便歐豆核對）</label><input id="oc-rn" type="text" autocomplete="name" maxlength="40" required></div>
      <div class="oc-f"><label for="oc-re">Email</label><input id="oc-re" type="email" autocomplete="email" required></div>
      <div class="oc-f"><label for="oc-rc">上過的班別／備註（選填）</label><input id="oc-rc" type="text" maxlength="200" placeholder="例如：LV1 週四晚上班"></div>
      <div class="oc-f"><label for="oc-rp">設定密碼（至少 6 個字）</label><input id="oc-rp" type="password" autocomplete="new-password" minlength="6" required></div>
      <div class="oc-f"><label for="oc-rp2">再輸入一次密碼</label><input id="oc-rp2" type="password" autocomplete="new-password" minlength="6" required></div>
      <button class="oc-btn" type="submit">送出申請</button>
    </form>

    <p class="oc-msg" id="oc-msg" role="status"></p>
    <p class="oc-note">非歐豆學員想使用，請透過 <a href="https://line.me/ti/p/~olddo" target="_blank" rel="noopener">LINE 洽詢</a> 費用。<br><a href="../">← 回歐豆攝影教室</a></p>
  </div>
</div>
<div class="oc-loading oc-hide" id="oc-loading"><div class="oc-spin"></div><div id="oc-ltext">載入歐色會中…</div></div>

<script>
(function(){
  var API='https://script.google.com/macros/s/AKfycbzahWJ6QNsC3v_g3cEA4kK5oMuE8Yo671RsDQRUC4MJrqO1W5hf7jUCueBbre2O9Y-Xjw/exec';
  var PEPPER='olddo-ocolor-v1';
  var KEY='oc_token';
  var $=function(id){return document.getElementById(id);};
  var msg=$('oc-msg');
  function say(t,ok){msg.textContent=t||'';msg.className='oc-msg '+(ok?'ok':'err');}
  function store(k,v){try{v===null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(e){}}
  function read(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function sha(s){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');});}
  function hashPw(email,pw){return sha(PEPPER+'|'+email.trim().toLowerCase()+'|'+pw);}
  function api(body){return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'});}
  function tab(login){$('oc-t-login').classList.toggle('on',login);$('oc-t-reg').classList.toggle('on',!login);$('oc-login').classList.toggle('oc-hide',!login);$('oc-reg').classList.toggle('oc-hide',login);say('');}
  $('oc-t-login').onclick=function(){tab(true);};
  $('oc-t-reg').onclick=function(){tab(false);};
  function busy(form,on){var b=form.querySelector('button');b.disabled=on;}

  function openTool(token){
    $('oc-gate').classList.add('oc-hide');$('oc-loading').classList.remove('oc-hide');
    api({action:'tool',token:token}).then(function(r){return r.text();}).then(function(t){
      if(t.charAt(0)==='{'){var j={};try{j=JSON.parse(t);}catch(e){}
        if(j.relogin)store(KEY,null);
        $('oc-loading').classList.add('oc-hide');$('oc-gate').classList.remove('oc-hide');tab(true);say(j.msg||'無法載入，請重新登入');return;}
      document.open();document.write(t);document.close();
      setTimeout(function(){document.title='歐色會 OCOLOR｜歐豆攝影教室';},3000);
    }).catch(function(){$('oc-loading').classList.add('oc-hide');$('oc-gate').classList.remove('oc-hide');say('網路連線有問題，請稍後再試');});
  }

  $('oc-login').onsubmit=function(e){
    e.preventDefault();var f=this,em=$('oc-le').value.trim(),pw=$('oc-lp').value;
    if(!em||!pw){say('請輸入 Email 和密碼');return;}
    busy(f,true);say('登入中…',true);
    hashPw(em,pw).then(function(h){return api({action:'login',email:em,hash:h});}).then(function(r){return r.json();}).then(function(j){
      busy(f,false);
      if(!j.ok){say(j.msg);return;}
      store(KEY,j.token);say('歡迎 '+j.name+'，使用期限到 '+j.expires,true);
      setTimeout(function(){openTool(j.token);},600);
    }).catch(function(){busy(f,false);say('網路連線有問題，請稍後再試');});
  };

  $('oc-reg').onsubmit=function(e){
    e.preventDefault();var f=this,nm=$('oc-rn').value.trim(),em=$('oc-re').value.trim(),nt=$('oc-rc').value.trim(),p1=$('oc-rp').value,p2=$('oc-rp2').value;
    if(!nm||!em){say('請填寫姓名和 Email');return;}
    if(p1.length<6){say('密碼至少要 6 個字');return;}
    if(p1!==p2){say('兩次輸入的密碼不一樣');return;}
    busy(f,true);say('送出中…',true);
    hashPw(em,p1).then(function(h){return api({action:'register',name:nm,email:em,note:nt,hash:h});}).then(function(r){return r.json();}).then(function(j){
      busy(f,false);say(j.msg,j.ok);if(j.ok){f.reset();$('oc-le').value=em;}
    }).catch(function(){busy(f,false);say('網路連線有問題，請稍後再試');});
  };

  var saved=read(KEY);
  if(saved)openTool(saved);
})();
</script>
</body>
</html>
